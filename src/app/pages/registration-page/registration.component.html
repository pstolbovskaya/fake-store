<div class="registration-container">
  <h2>Вход в систему</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <input type="email" id="email" [(ngModel)]="credentials.email" name="email" placeholder="Email" required>
    </div>
    <div class="form-group">
      <input type="password" id="password" [(ngModel)]="credentials.password" name="password" placeholder="Password" required>
    </div>
    <div class="form-group">
      <input type="password" id="password-confirmation" [(ngModel)]="credentials.confirmPassword" name="password-confirmation" placeholder="Confirm your password" required>
    </div>
    @if(errorMessage){
      <p class="error">{{ errorMessage }}</p>
    }
    <div class="button-container">
      <button type="submit">Зарегистрироваться</button>
    </div>
  </form>
</div>
