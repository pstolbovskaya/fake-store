<div class="registration-container">
  <h2>Вход в систему</h2>
  <form (ngSubmit)="onSubmit()" [formGroup]="credentials">
    <div class="form-group">
      <input id="name" [formControl]="credentials.controls.name"  name="name" placeholder="Name" required>
    </div>
    <div class="form-group">
      <input type="email" id="email" [formControl]="credentials.controls.email"  name="email" placeholder="Email" required>
    </div>
    <div class="form-group">
      <input type="password" id="password" [formControl]="credentials.controls.password" name="password" placeholder="Password" required>
    </div>
    <div class="form-group">
      <input type="password" id="password-confirmation" [formControl]="credentials.controls.confirmPassword" name="password-confirmation" placeholder="Confirm your password" required>
    </div>
    <div class="form-group">
      <input type="file" id="avatar" [formControl]="credentials.controls.avatar" name="avatar" placeholder="Confirm your password" required >
    </div>
    @if(errorMessage){
      <p class="error">{{ errorMessage }}</p>
    }
    <div class="button-container">
      <button type="submit" [disabled]="credentials.invalid">Зарегистрироваться</button>
    </div>
  </form>
</div>
