<div [formGroup]="formGroup" class="categories">
  <button (click)="clearCategories()">Clear categories</button>
  @for (category of categories(); track category.id) {
      <div>
        <input type="radio" [value]="category.id.toString()" formControlName=hui>
        <label>{{category.name}}</label>
      </div>
  }
</div>
